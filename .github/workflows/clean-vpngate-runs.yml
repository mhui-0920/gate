name: Clean VPN Gate Runs
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete all completed runs of target workflows
        uses: actions/github-script@v7
        with:
          script: |
            const WORKFLOW_LIST = [
              "VPN Gate Node Check",
              "Clean VPN Gate Runs"
            ];
            const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            for(const WORKFLOW_NAME of WORKFLOW_LIST){
              const targetRuns = runs.workflow_runs
                .filter(r => r.name === WORKFLOW_NAME && ["completed","success","failure","cancelled"].includes(r.status))
                .sort((a,b)=> new Date(b.created_at) - new Date(a.created_at));
              
              console.log(`=====【${WORKFLOW_NAME}】=====`);
              console.log(`一共找到${targetRuns.length}条已完成记录，全部删除`);
              
              for(const run of targetRuns){
                console.log(`删除RunID: ${run.id}，创建时间: ${run.created_at}`);
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
              }
            }
