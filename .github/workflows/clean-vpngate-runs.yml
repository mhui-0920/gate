name: Clean VPN Gate Runs
on:
  # UTC22点 = 北京时间次日早上6点，在节点检测任务之后执行
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch: # 支持手动触发清理

permissions:
  actions: write
  contents: read

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete old workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            // 需要清理的两个工作流名称
            const WORKFLOW_LIST = [
              "VPN Gate Node Check",
              "Clean VPN Gate Runs"
            ];
            const KEEP_COUNT = 1; // 每个工作流都只保留最近1条记录
            const { data: runs } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            for(const WORKFLOW_NAME of WORKFLOW_LIST){
              const targetRuns = runs.workflow_runs
                .filter(r => r.name === WORKFLOW_NAME && ["completed","success","failure","cancelled"].includes(r.status))
                .sort((a,b)=> new Date(b.created_at) - new Date(a.created_at));
              
              const toDelete = targetRuns.slice(KEEP_COUNT);
              console.log(`=====【${WORKFLOW_NAME}】=====`);
              console.log(`找到${targetRuns.length}条记录，准备删除${toDelete.length}条旧记录`);
              
              for(const run of toDelete){
                console.log(`删除RunID: ${run.id}，创建时间: ${run.created_at}`);
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
              }
            }
